spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:P@ssw0rd123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/Pneumonia.sql

# ===== SERVER =====
server.port=8090

# ===== AI SERVICE (ROBUST FALLBACK CONFIGURATION) =====
# Primary URL: AI Service on port 8000
ai.service.predict-url=http://localhost:8000/predict
# Fallback URLs: Try alternative ports if 8000 is busy
ai.service.predict-fallback-urls=http://localhost:8000/predict,http://localhost:8001/predict,http://localhost:8002/predict,http://localhost:8003/predict

ai.service.gradcam-url=http://localhost:8000/gradcam
ai.service.gradcam-fallback-urls=http://localhost:8000/gradcam,http://localhost:8001/gradcam,http://localhost:8002/gradcam,http://localhost:8003/gradcam

ai.service.health-url=http://localhost:8000/health
ai.service.health-fallback-urls=http://localhost:8000/health,http://localhost:8001/health,http://localhost:8002/health,http://localhost:8003/health

ai.service.retrain-url=http://localhost:8000/retrain

# Connection timeout (5 seconds)
ai.service.connect-timeout=5000
# Read timeout (30 seconds)
ai.service.read-timeout=30000

# Tên ứng dụng
spring.application.name=PneumoniaDiagnosis

spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# JWT Configuration
jwt.secret=yourSuperSecretKeyForPneumoniaSystem2026
jwt.expiration=86400000   # 24 giờ (miliseconds)

# Tắt log security để sạch console (tùy chọn)
logging.level.org.springframework.security=ERROR

