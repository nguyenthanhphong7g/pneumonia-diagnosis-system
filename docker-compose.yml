version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASS: P@ssw0rd123
    ports:
      - "8090:8090"
    # Spring Boot will auto-create tables via JPA (ddl-auto: update)

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  ai-service:
    build: ./ai-service
    depends_on:
      - backend
    environment:
      # add AI‑service env vars if needed
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service/models:/app/models
      - ./ai-service/dataset:/app/dataset

volumes:
  sqldata:
